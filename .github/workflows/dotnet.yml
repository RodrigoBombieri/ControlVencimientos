
name: .NET CI

on:
  push:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ControlVencimientosS

    steps:
      - name: Obtener código
        uses: actions/checkout@v6

      - name: Configurar .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependencias
        run: dotnet restore ControlVencimientosS.slnx

      - name: Compilar solución
        run: dotnet build ControlVencimientosS.slnx --no-restore

      - name: Ejecutar tests
        run: dotnet test ControlVencimientosS.slnx --no-restore
