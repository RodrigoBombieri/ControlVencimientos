
name: .NET CI

on:
  push:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0

    defaults:
      run:
        working-directory: ControlVencimientosS

    steps:
      - name: Obtener código
        uses: actions/checkout@v6

      - name: Verificar versión de .NET
        run: dotnet --info

      - name: Restaurar dependencias
        run: dotnet restore ControlVencimientosS.slnx

      - name: Compilar solución
        run: dotnet build ControlVencimientosS.slnx --no-restore

      - name: Ejecutar tests
        run: dotnet test ControlVencimientosS.slnx --no-restore
