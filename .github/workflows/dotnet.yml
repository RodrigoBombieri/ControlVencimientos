
name: .NET CI

on:
  push:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener código
        uses: actions/checkout@v6

      - name: Configurar .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.4x'

      - name: Restaurar dependencias
        run: dotnet restore

      - name: Compilar solución
        run: dotnet build --no-restore

      - name: Ejecutar tests
        run: dotnet test --no-build
